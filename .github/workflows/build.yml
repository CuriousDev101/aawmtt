name: Build and Release

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  push:
    branches:
      - "**"         # Runs on every push to any branch
    tags:
      - "v*"         # Runs when a version tag (e.g., v2.8) is pushed
    paths-ignore:
      - "**/*.md"

jobs:
  build:
    # Use ubuntu-22.04 for maximum compatibility with Zorin OS (which is based on Ubuntu LTS)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # build-essential provides gcc, g++, make
          # libx11-dev is required by find_package(X11 REQUIRED) in CMakeLists.txt
          sudo apt-get install -y build-essential cmake git libx11-dev xserver-xephyr

      - name: Compile
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aawmtt-zorin-ubuntu-x86_64
          path: build/aawmtt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/aawmtt
          generate_release_notes: true
